
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Submitted | Cekelet Teh</title>

    <style>
        body {
            background-color: #FDE5CB;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-container {
            background-color: #E8C9AD;
            width: 450px;
            padding: 50px 35px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(42, 17, 5, 0.15);
        }

        .check-icon {
            width: 80px;
            height: 80px;
            background-color: #A65E32;
            color: white;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
            margin: 0 auto 25px;
        }

        h1 {
            color: #2A1105;
            font-size: 30px;
            margin-bottom: 15px;
        }

        p {
            color: #693512;
            font-size: 16px;
            line-height: 1.6;
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 30px;

            background-color: #A65E32;
            color: white;

            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-button:hover {
            background-color: #2A1105;
        }
    </style>
</head>

<body>

    <div class="success-container">

        <div class="check-icon">
