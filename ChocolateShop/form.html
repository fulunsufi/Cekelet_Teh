
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Order Form | Cekelet Teh</title>

    <link rel="stylesheet" href="chocshopstyle.css">

    <style>
        body {
            background-color: #FDE5CB;
            font-family: Arial, sans-serif;
            margin: 0;
            color: #2A1105;
        }

        #order-form {
            max-width: 550px;
            margin: 60px auto;
            padding: 40px;
            background-color: #E8C9AD;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(42, 17, 5, 0.15);
        }

        #order-form h2 {
            text-align: center;
            color: #2A1105;
            font-size: 28px;
            margin-bottom: 10px;
        }

        #order-form p {
            text-align: center;
            color: #693512;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #2A1105;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #A65E32;
            border-radius: 8px;
            background-color: #FFF9F2;
            color: #2A1105;
            font-size: 14px;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #8A7466;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .proceed-button {
            width: 100%;
            padding: 14px;
            background-color: #A65E32;
            color: #FFFFFF;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .proceed-button:hover {
            background-color: #2A1105;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #693512;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            color: #A65E32;
        }
    </style>
</head>

<body>

    <section id="order-form">

        <h2>Customer Details</h2>
        <p>Please fill in your details to proceed with your order.</p>

        <form id="customerForm">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label for="address">Delivery Address</label>
                <textarea id="address"
                    name="address"
                    placeholder="Enter your complete address"
                    required></textarea>
            </div>

            <div class="form-group">
                <label for="contact">Contact Number</label>
                <input type="tel" id="contact"
                    name="contact"
                    placeholder="e.g. 0123456789"
                    required>
            </div>

            <button type="submit" class="proceed-button">
                Proceed to Payment
            </button>

        </form>

        <a href="shop.html" class="back-link">
            ← Back to Shop
        </a>

    </section>

    <script>
        document.getElementById("customerForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const fullname = document.getElementById("fullname").value;
            const address = document.getElementById("address").value;
            const contact = document.getElementById("contact").value;

            localStorage.setItem("customerName", fullname);
            localStorage.setItem("customerAddress", address);
            localStorage.setItem("customerContact", contact);

            alert("Customer details saved successfully!");

        });
    </script>
    <script>
    document.getElementById("customerForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const fullname = document.getElementById("fullname").value;
        const address = document.getElementById("address").value;
        const contact = document.getElementById("contact").value;

        localStorage.setItem("customerName", fullname);
        localStorage.setItem("customerAddress", address);
        localStorage.setItem("customerContact", contact);

        window.location.href = "success.html";

    });
</script>

</body>
</html>
