
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cekelet Teh | My Cart</title>

    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"/>
    <link rel="stylesheet" href="chocshopstyle.css">

    <style>
        #cart-page {
            padding: 40px 80px;
            min-height: 70vh;
            background: #FDE5CB;
        }

        #cart-page h2 {
            text-align: center;
            color: #693512;
            margin-bottom: 30px;
        }

        #cart-page .cart-container {
            max-width: 1000px;
            margin: auto;
            background: #D8B49A;
            padding: 25px;
            border-radius: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 20px 10px;
            border-bottom: 1px solid #A65E32;
        }

        .cart-item h4 {
            color: #4A2415;
            margin: 0 0 8px;
        }

        .cart-item p {
            margin: 5px 0;
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-quantity button,
        .remove-btn {
            background: #A65E32;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .cart-quantity input {
            width: 45px;
            padding: 7px;
            text-align: center;
        }

        .remove-btn {
            background: #693512;
        }

        .cart-total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
            color: #4A2415;
        }

        .cart-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .cart-actions a,
        .cart-actions button {
            background: #A65E32;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            cursor: pointer;
        }

        .empty-cart {
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 600px) {
            #cart-page {
                padding: 30px 15px;
            }

            .cart-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <audio controls id="bgMusic" autoplay loop>
        <source src="audio/bgmusic.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById("bgMusic");

        document.addEventListener("click", function() {
            music.play();
        }, { once: true });
    </script>

    
    <section id="header">

        <a href="Index.html">
            <img src="img/logo.png" class="logo" alt="Cekelet Teh">
        </a>

        <div>
            <ul id="navbar">
                <li><a href="Index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li>
                    <a class="active" href="cart.html">
                        <i class="fa fa-shopping-cart"></i>
                    </a>
                </li>
            </ul>
        </div>

    </section>

    <section id="cart-page">

        <h2>My Shopping Cart</h2>

        <div class="cart-container">

            <div id="cart-items"></div>

            <div class="cart-total">
                Total: RM <span id="total">0.00</span>
            </div>

            <div class="cart-actions">
                <a href="shop.html">Continue Shopping</a>
                <button onclick="clearCart()">Clear Cart</button>
            </div>

        </div>

    </section>
    <section id="submit-order">
    <a href="form.html" target="_blank" class="submit-button">Submit Order</a>
</section>
    <script>

        function displayCart() {

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            const cartItems = document.getElementById("cart-items");
            const totalDisplay = document.getElementById("total");

            cartItems.innerHTML = "";

            let total = 0;

            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <div class="empty-cart">
                        <h3>Your Cart is Empty!</h3>
                        <p>Start adding your favourite chocolates.</p>
                    </div>
                `;

                totalDisplay.textContent = "0.00";
                return;
            }

            cart.forEach((item, index) => {

                const subtotal = item.price * item.quantity;

                total += subtotal;

                cartItems.innerHTML += `
                    <div class="cart-item">

                        <div>
                            <h4>${item.name}</h4>
                            <p>Price: RM ${item.price.toFixed(2)}</p>
                            <p>Subtotal: RM ${subtotal.toFixed(2)}</p>
                        </div>

                        <div class="cart-quantity">

                            <button onclick="changeQuantity(${index}, -1)">-</button>

                            <input type="number"
                                value="${item.quantity}"
                                min="1"
                                onchange="updateQuantity(${index}, this.value)">

                            <button onclick="changeQuantity(${index}, 1)">+</button>

                        </div>

                        <button class="remove-btn"
                            onclick="removeItem(${index})">
                            Remove
                        </button>

                    </div>
                `;
            });

            totalDisplay.textContent = total.toFixed(2);
        }


        function changeQuantity(index, amount) {

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            cart[index].quantity += amount;

            if (cart[index].quantity < 1) {
                cart[index].quantity = 1;
            }

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }


        function updateQuantity(index, value) {

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            cart[index].quantity = Math.max(1, parseInt(value) || 1);

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }


        function removeItem(index) {

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            cart.splice(index, 1);

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }


        function clearCart() {

            localStorage.removeItem("cart");

            displayCart();
        }


        displayCart();

    </script>

</body>
</html>
